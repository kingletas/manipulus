[project]
name = "manipulus"
version = "0.4.0"
description = "Static RequireJS bundle planner for Magento 2, with no browser and no Node."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Luis Tineo", email = "code@kingletas.com" }]
keywords = ["magento", "requirejs", "amd", "bundler", "performance"]

dependencies = [
    "defusedxml>=0.7.1",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
]

[project.scripts]
manipulus = "manipulus.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manipulus"]

[tool.hatch.build.targets.wheel.force-include]
"magento-module" = "manipulus/magento_module"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "C4", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
