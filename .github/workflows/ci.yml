name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint, private-info sweep and tests
        run: make check

  magento-module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the manifest declares, and the newest PHP Magento supports.
        php: ['8.2', '8.4']
    defaults:
      run:
        working-directory: dist/magento
    env:
      COMPOSER_NO_INTERACTION: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, intl, bcmath, soap
          coverage: none

      - name: Every PHP file parses
        run: make lint

      # A pull request from a fork or from Dependabot is given no Actions
      # secrets, so there it warns and skips; everywhere else it fails.
      - name: Magento credentials
        id: credentials
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "${COMPOSER_AUTH}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT}" = "pull_request" ]; then
            echo "::warning::COMPOSER_AUTH is not available to this pull request, so the Magento module's suite did not run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::COMPOSER_AUTH is not set. The Magento module's suite needs magento/framework from repo.magento.com."
            exit 1
          fi

      - name: Install the module's dependencies
        if: steps.credentials.outputs.present == 'true'
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: make install

      - name: Coding standard, static analysis and unit suite
        if: steps.credentials.outputs.present == 'true'
        run: make check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the container image
        run: docker build -t manipulus:ci .

      - name: The image runs
        run: docker run --rm manipulus:ci --version

      - name: The image carries the Magento module it emits
        run: |
          docker run --rm --entrypoint /bin/sh manipulus:ci -c \
            'test -f /opt/manipulus/lib/python3.12/site-packages/manipulus/magento_module/registration.php'
